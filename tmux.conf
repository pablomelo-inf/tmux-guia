# Config do tmux. Em cada PC, "tm conf" linka este arquivo em ~/.tmux.conf.
set -g mouse on
set -g history-limit 50000

# Sobreviver a reboot/desligamento: tmux-resurrect salva sessões, janelas (com nome),
# painéis e diretórios; tmux-continuum salva a cada 5 min e restaura ao subir o servidor.
# Instalar os plugins: "tm plugins".
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
# O continuum roda "systemctl --user disable tmux.service" a cada início se isto não for 'on', o que trava o serviço do "tm boot".
# 'on' só confere que o serviço já está ativo e não mexe em nada.
set -g @continuum-boot 'on'
set -g @continuum-save-interval '5'
set -g @resurrect-capture-pane-contents 'on'
# Programas religados ao restaurar (~ = casa pelo nome em qualquer parte do comando)
set -g @resurrect-processes '"~claude->claude --continue"'

# Sempre na última linha. Só roda se o TPM já foi instalado.
if "test -x ~/.tmux/plugins/tpm/tpm" "run '~/.tmux/plugins/tpm/tpm'"
