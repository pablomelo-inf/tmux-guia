# tmux config (needs tmux 3.2+). On each PC, "tm conf" links this file to ~/.tmux.conf.
# Machine-specific settings go in ~/.tmux.local.conf (loaded near the end, not in the repo).
set -g mouse on
set -g history-limit 50000

# Esc reaches vim/neovim at once (the default waits 500 ms for an Alt sequence).
set -s escape-time 10
# Lets editors notice focus changes (e.g. vim reloading a file changed outside).
set -g focus-events on
# 256 colors + true color. tmux-256color only if this machine has its terminfo (else tmux's default).
if "infocmp tmux-256color >/dev/null 2>&1" "set -g default-terminal tmux-256color"
set -as terminal-features ",xterm-256color:RGB,*256col*:RGB,alacritty:RGB,xterm-kitty:RGB,wezterm:RGB"

# Windows and panes start at 1 (next to the prefix on the keyboard), with no gaps after closing one.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# New windows and splits open in the current pane's folder.
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
# Ctrl+b r reloads this file in every session.
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Show the tmux session name in the terminal tab/window title (e.g. "projetoli0").
set -g set-titles on
set -g set-titles-string '#S'

# Status bar: host, auto-save interval (continuum fills #{continuum_status} in) and time.
set -g status-right-length 60
set -g status-right ' #H | save: #{continuum_status} min | %H:%M '

# Copy & paste. With mouse on, tmux already copies on mouse release and pastes on middle click.
# PageUp enters copy mode and scrolls, so Ctrl+b [ is not needed.
bind -n PageUp copy-mode -eu
# Copies also go to the system clipboard by OSC 52 in terminals that support it (kitty, wezterm,
# alacritty, foot, xterm, iTerm2), over SSH too. GNOME Terminal ignores it: use the tools below.
# "external" (not "on"): tmux may set the clipboard, programs inside the panes may not.
set -s set-clipboard external
set -as terminal-features ",xterm*:clipboard,alacritty:clipboard,wezterm:clipboard,foot:clipboard"
# Also send copies to the system clipboard when one of these tools is installed.
if "command -v wl-copy" "set -s copy-command 'wl-copy'" \
  "if 'command -v xclip' \"set -s copy-command 'xclip -selection clipboard -in'\" \
  \"if 'command -v xsel' \\\"set -s copy-command 'xsel --clipboard --input'\\\"\""

# Survive reboot/shutdown: tmux-resurrect saves sessions, named windows, panes and
# directories; tmux-continuum saves every 5 min and restores when the server starts.
# Install the plugins with: "tm plugins".
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
# Unless this is 'on', continuum runs "systemctl --user disable tmux.service" on every start,
# which hangs the "tm boot" service. With 'on' it only checks that the service is enabled.
set -g @continuum-boot 'on'
set -g @continuum-save-interval '5'
set -g @resurrect-capture-pane-contents 'on'
# Programs relaunched on restore (~ = match by name anywhere in the command). Covered by the tests.
set -g @resurrect-processes '"~claude->claude --continue"'

# Per-machine overrides; -q: no error when the file does not exist.
source-file -q ~/.tmux.local.conf

# Keep this as the last line. Only runs if TPM is already installed.
if "test -x ~/.tmux/plugins/tpm/tpm" "run '~/.tmux/plugins/tpm/tpm'"
