version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before taking a new release: a compromised one is usually caught and pulled by then.
    cooldown:
      default-days: 7
  # Base image digests in tests/Dockerfile.
  - package-ecosystem: docker
    directory: /tests
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Digests only: each stage pins an Ubuntu release to test its tmux version (22.04 = 3.2a, 24.04 = 3.4).
    ignore:
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
