name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck tests/test.sh
      - name: Makefile parses
        run: make --no-print-directory help

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install tmux
        run: sudo apt-get install -y --no-install-recommends tmux
      - name: Tests (including plugin install and pinned commits)
        run: RUN_NETWORK=1 tests/test.sh
